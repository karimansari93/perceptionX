  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
  }
  .canvas {
    width: 1200px;
    height: 630px;
    position: relative;
    background: linear-gradient(135deg, #f7dee7 0%, #ffffff 55%, #eaf1fb 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 80px;
  }
  .logo { height: 34px; margin-bottom: 40px; }
  h1 {
    font-family: 'Geologica', 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
    font-size: 54px;
    line-height: 1.15;
    color: #13274F;
    max-width: 680px;
  }
  h1 span { color: #DB5E89; }
  p.tagline {
    margin-top: 24px;
    font-size: 21px;
    line-height: 1.5;
    color: #13274F;
    opacity: 0.72;
    max-width: 560px;
  }
  .orbit {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    width: 400px;
    height: 400px;
  }
  .badge {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 64px;
    height: 64px;
    margin: -32px 0 0 -32px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(19,39,79,0.25);
  }
  .badge img { width: 100%; height: 100%; object-fit: cover; }
  .icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 14px rgba(19,39,79,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon img { width: 28px; height: 28px; object-fit: contain; }
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border: 1px solid #dbe2f0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
</style>
