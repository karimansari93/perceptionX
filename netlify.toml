# Activate links are unlisted-by-possession: the token in the URL is the only
# credential, and the page names the client. An indexed activate page would put
# both into public search results and make the client list discoverable with a
# site: query. The meta tag set in Activate.tsx only reaches crawlers that run
# our JS, and the main search crawlers do not — this header is what actually
# excludes them.
#
# Deliberately NOT a Disallow in robots.txt: a disallowed URL is never fetched,
# so the crawler never sees "noindex", and Google may still list the bare URL
# when it finds a link elsewhere. Allowing the fetch is what gets the page
# dropped from the index outright. Social unfurlers ignore X-Robots-Tag, so
# Slack/Teams link previews are unaffected.
[[headers]]
  for = "/activate/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed assets are immutable — their filename changes on every build, so they
# can be cached forever. This is safe because new deploys reference new hashes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must NEVER be cached: it's the manifest that points at the current
# hashed chunks. A stale cached copy is the root cause of post-deploy chunk-load
# failures, since the tab keeps requesting old /assets/* that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# onboarding.html is index.html with onboarding meta tags (built in
# vite.config.ts) — it references the same hashed chunks, so the same
# no-cache rule applies.
[[headers]]
  for = "/onboarding.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
