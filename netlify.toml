[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed assets are immutable — their filename changes on every build, so they
# can be cached forever. This is safe because new deploys reference new hashes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must NEVER be cached: it's the manifest that points at the current
# hashed chunks. A stale cached copy is the root cause of post-deploy chunk-load
# failures, since the tab keeps requesting old /assets/* that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# onboarding.html is index.html with onboarding meta tags (built in
# vite.config.ts) — it references the same hashed chunks, so the same
# no-cache rule applies.
[[headers]]
  for = "/onboarding.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
