<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>PerceptionX Dashboard — Enterprise AI Employer Reputation Management</title>
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://*.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://ofyjvfmcgtntwamkubui.supabase.co; img-src 'self' data: https:; connect-src 'self' https://ofyjvfmcgtntwamkubui.supabase.co wss://ofyjvfmcgtntwamkubui.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://www.google-analytics.com https://*.hotjar.com https://*.hotjar.io wss://*.hotjar.com wss://*.hotjar.io https://*.railway.app http://localhost:3001; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <meta name="description" content="The PerceptionX dashboard for enterprise talent teams. Sign in to see how AI is answering questions about your employer brand." />
    <meta name="author" content="PerceptionX" />
    <meta name="keywords" content="employer brand ai, sentiment analysis, AI insights, brand monitoring, reputation management, talent acquisition, employer branding" />
    <!--
      app.perceptionx.ai is the logged-in dashboard: every route is behind
      sign-in or a link token, and every one of them is served this same shell.
      Indexing it advertises the whole domain under one title and description
      for pages a crawler can never see the contents of, so the default is
      noindex. `follow` stays so outbound links are still crawled, and
      robots.txt deliberately allows crawling — a Disallow would stop Googlebot
      reading this tag, which is what actually removes an already-indexed URL.

      A route that is genuinely public needs server-rendered HTML with its own
      title, description, canonical and an explicit `index, follow` that
      overrides this (see META_VARIANTS in vite.config.ts for the mechanism).
      A robots tag injected client-side after load is not reliable.
    -->
    <meta name="robots" content="noindex, follow" />
    <meta name="googlebot" content="noindex, follow" />
    <link rel="canonical" href="https://app.perceptionx.ai" />

    <!--
      Every tag below is an anchor as well as a default: the /onboarding and
      /activate variants are built from this file by string replacement (see
      onboardingHtml/activateHtml in vite.config.ts) and rewritten again per
      token at the edge. A tag that isn't here can't be personalized, which is
      why og:url, the twitter title/description pair and the image dimensions
      are spelled out rather than left to the crawler to infer.
    -->
    <meta property="og:title" content="PerceptionX Dashboard — Enterprise AI Employer Reputation Management" />
    <meta property="og:description" content="The PerceptionX dashboard for enterprise talent teams. Sign in to see how AI is answering questions about your employer brand." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PerceptionX" />
    <meta property="og:url" content="https://app.perceptionx.ai" />
    <!-- Absolute: WhatsApp and LinkedIn resolve og:image inconsistently when
         it's a root-relative path, and drop the card entirely when they fail. -->
    <meta property="og:image" content="https://app.perceptionx.ai/logos/perceptionx-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PerceptionX" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tryperceptionx" />
    <meta name="twitter:title" content="PerceptionX Dashboard — Enterprise AI Employer Reputation Management" />
    <meta name="twitter:description" content="The PerceptionX dashboard for enterprise talent teams. Sign in to see how AI is answering questions about your employer brand." />
    <meta name="twitter:image" content="https://app.perceptionx.ai/logos/perceptionx-og.png" />

    <!-- Geologica and Plus Jakarta Sans Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FGRDCN2WF3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FGRDCN2WF3');
      
      // Google Ads conversion tracking
      gtag('event', 'ads_conversion_PAGE_VIEW_1', {
        // Event parameters for initial page load
        page_title: document.title,
        page_location: window.location.href,
        page_path: window.location.pathname,
      });
    </script>

    <!-- Hotjar is initialized via @hotjar/browser SDK in App.tsx -->
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
